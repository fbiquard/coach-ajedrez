name: Actualizar partidas

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["site/**", "worker/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install chess==1.11.2 anthropic

      - name: Instalar Stockfish
        run: |
          curl -sSL -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar
          tar xf sf.tar
          echo "STOCKFISH=$PWD/stockfish/stockfish-ubuntu-x86-64-avx2" >> "$GITHUB_ENV"

      - name: Analizar partidas nuevas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.AJEDREZ }}
          CHESS_USER: fbiquard
          MAX_GAMES: "25"
          THINK: "0.15"
        run: python worker/run.py

      - name: Guardar datos
        run: |
          git config user.name "coach-bot"
          git config user.email "coach-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Partidas actualizadas $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
